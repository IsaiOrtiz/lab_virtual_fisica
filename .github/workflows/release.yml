name: Build y Release

# - Al subir un tag como v1.0.1: compila el APK y lo adjunta a un Release.
# - Manualmente (pestaña Actions -> "Run workflow"): solo compila el APK
#   y lo deja como artefacto descargable, sin crear ningún release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones de Flutter y Dart
        run: flutter --version

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Nombrar el APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="prueba-${GITHUB_SHA::7}"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "lab_virtual_fisica-${VERSION}.apk"
          echo "APK_FILE=lab_virtual_fisica-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_FILE }}
          retention-days: 14

      - name: Buscar notas del release
        if: github.ref_type == 'tag'
        run: |
          if [ -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md" ]; then
            echo "NOTES_FILE=RELEASE_NOTES_${GITHUB_REF_NAME}.md" >> "$GITHUB_ENV"
          fi

      - name: Publicar Release (con notas redactadas)
        if: github.ref_type == 'tag' && env.NOTES_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          body_path: ${{ env.NOTES_FILE }}

      - name: Publicar Release (notas autogeneradas)
        if: github.ref_type == 'tag' && env.NOTES_FILE == ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
